version: "3.8"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "disease_db"
      MYSQL_ROOT_PASSWORD: "password"
    ports:
      - "3307:3306"
    volumes:
      - ./data/db:/var/lib/mysql

  crawler:
    build: ./backend/crawler-service
    env_file:
      - ./backend/report-service/.env
    depends_on:
      - db

  processor:
    build: ./backend/processor-service
    env_file:
      - ./backend/report-service/.env
    depends_on:
      - db

  forecast:
    build: ./backend/forecast-service
    ports:
      - "8010:8010"
    env_file:
      - ./backend/report-service/.env
    volumes:
      - ./backend/forecast-service/models:/app/models
    depends_on:
      - db

  chatbot:
    build: ./backend/chatbot-service
    ports:
      - "8001:8000"
    env_file:
      - ./backend/report-service/.env

  api:
    build: ./backend/api-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./backend/report-service/.env
    environment:
      FORECAST_SERVICE_URL: "http://forecast:8010"
      CHATBOT_SERVICE_URL: "http://chatbot:8000/chat"
    volumes:
      - ./backend/report-service:/app/report-service
    depends_on:
      - db
      - forecast
      - chatbot

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
